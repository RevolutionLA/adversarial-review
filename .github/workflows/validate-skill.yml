name: validate-skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: Agent Skills 规范校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 校验器自身的回归测试
        run: node scripts/test-validate-skill.mjs

      - name: 突变测试（验证回归测试真的能抓住缺陷）
        run: node scripts/test-mutations.mjs

      - name: 校验 SKILL.md 符合 Agent Skills 规范
        run: node scripts/validate-skill.mjs skills/adversarial-review

      - name: 校验 frontmatter name 与目录名一致
        run: |
          set -euo pipefail
          dir="skills/adversarial-review"
          name=$(sed -n 's/^name:[[:space:]]*//p' "$dir/SKILL.md" | head -n 1 | tr -d '\r')
          echo "frontmatter name = $name"
          test "$name" = "$(basename "$dir")" \
            || { echo "::error::frontmatter name ($name) 必须与目录名一致"; exit 1; }

      - name: 校验 SKILL.md 正文行数（规范建议 < 500 行）
        run: |
          set -euo pipefail
          f="skills/adversarial-review/SKILL.md"
          # 规范原文：Keep your main SKILL.md under 500 lines
          # 只统计**正文**（frontmatter 之后），因为规范约束的是载入上下文的部分，
          # frontmatter 走的是 metadata 通道（~100 tokens），不应计入正文行数。
          body=$(awk 'BEGIN{n=0;fm=0} /^---[[:space:]]*$/{fm++; next} fm>=2{n++} END{print n}' "$f")
          total=$(wc -l < "$f")
          echo "SKILL.md 总行数: $total，正文行数: $body"
          if [ "$body" -ge 500 ]; then
            echo "::error::$f 正文有 $body 行，超过 500 行建议上限，请用渐进式披露拆分到 references/"
            exit 1
          fi

      - name: 校验 shell 脚本语法
        run: |
          set -euo pipefail
          bash -n skills/adversarial-review/scripts/install.sh
          bash -n skills/adversarial-review/scripts/verify-install.sh

      - name: 校验 PowerShell 脚本语法
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errs.Count) 个语法错误"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: 校验 markdown 中的本地链接可达
        run: node scripts/check-links.mjs
