name: validate-skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: Agent Skills 规范校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 校验 SKILL.md 符合 Agent Skills 规范
        run: node scripts/validate-skill.mjs .

      - name: 校验 frontmatter name 与仓库/目录名一致
        run: |
          name=$(sed -n 's/^name:[[:space:]]*//p' SKILL.md | head -n 1 | tr -d '\r')
          echo "frontmatter name = $name"
          test "$name" = "adversarial-review" || { echo "::error::name 必须为 adversarial-review"; exit 1; }

      - name: 校验 install.sh 语法
        run: bash -n scripts/install.sh

      - name: 校验 README 中的本地链接可达
        run: |
          fail=0
          for f in $(grep -oE '\]\(\.?/?[A-Za-z0-9_./-]+\.(md|sh|ps1|mjs)\)' README.md references/*.md 2>/dev/null \
                     | sed -E 's/.*\]\(//; s/\)$//' | sed 's|^\./||' | sort -u); do
            if [ ! -e "$f" ] && [ ! -e "$(dirname references)/$f" ]; then
              echo "::warning::README 引用了不存在的文件: $f"
            fi
          done
          exit $fail
