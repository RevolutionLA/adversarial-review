name: validate-skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: Agent Skills 规范校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 校验器自身的回归测试
        run: node scripts/test-validate-skill.mjs

      - name: 校验 SKILL.md 符合 Agent Skills 规范
        run: node scripts/validate-skill.mjs skills/adversarial-review

      - name: 校验 frontmatter name 与目录名一致
        run: |
          set -euo pipefail
          dir="skills/adversarial-review"
          name=$(sed -n 's/^name:[[:space:]]*//p' "$dir/SKILL.md" | head -n 1 | tr -d '\r')
          echo "frontmatter name = $name"
          test "$name" = "$(basename "$dir")" \
            || { echo "::error::frontmatter name ($name) 必须与目录名一致"; exit 1; }

      - name: 校验 SKILL.md 正文行数（规范建议 < 500 行）
        run: |
          set -euo pipefail
          f="skills/adversarial-review/SKILL.md"
          lines=$(wc -l < "$f")
          echo "SKILL.md 正文行数: $lines"
          if [ "$lines" -ge 500 ]; then
            echo "::error::$f 有 $lines 行，超过 500 行上限，请用渐进式披露拆分到 references/"
            exit 1
          fi

      - name: 校验 shell / PowerShell 脚本语法
        run: |
          set -euo pipefail
          bash -n skills/adversarial-review/scripts/install.sh
          bash -n skills/adversarial-review/scripts/verify-install.sh

      - name: 校验 markdown 中的本地链接可达
        run: node scripts/check-links.mjs
